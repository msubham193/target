[project]
name = "geopoc"
version = "0.1.0"
description = "Geospatial PoC API (Phase 1: workspace, projects, CRS search, health)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    # Pinned: on this machine Windows Smart App Control (enforcing) blocks the native libraries shipped in
    # psycopg-binary 3.3.6 and pyproj 3.7.2. These versions were verified to load. Re-test before raising.
    "psycopg[binary]==3.2.10",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "pydantic-settings>=2.4",
    "pyproj==3.7.1",
    "shapely>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "schemathesis>=4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["E501"]
