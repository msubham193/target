# Model registry: the single place where models are configured. Pipeline code contains no model settings.
#
# - Every model here runs locally. An entry with `locality: remote` is refused by the loader.
# - Weights are not in the repository. Install them with:
#       uv run python -m geopoc.devtools fetch-model <name>@<version>
#   which downloads once to <DATA_ROOT>/weights and verifies the size and checksum below.
# - No model here has been evaluated on representative data. `calibrated: false` means its score is not a
#   probability and every finding it produces starts as needs_review.
models:
  - name: fasterrcnn_resnet50_fpn_v2
    version: coco_v1
    pipeline: ground_image
    task: object_detection
    runtime: torchvision
    locality: local
    card: models/cards/fasterrcnn_resnet50_fpn_v2.md
    licence: "torchvision code BSD-3-Clause; weights trained on COCO 2017. Approved for local PoC evaluation only; licensing review of the weights is pending."
    weights:
      path: weights/fasterrcnn_resnet50_fpn_v2/coco_v1/fasterrcnn_resnet50_fpn_v2_coco-dd69338a.pth
      source_url: https://download.pytorch.org/models/fasterrcnn_resnet50_fpn_v2_coco-dd69338a.pth
      size_bytes: 175221657
      sha256: dd69338a24b8d7381807e247652bdc356325bcbaf1cd3e092e00e0a1a58706bf
    score:
      semantics: >-
        Faster R-CNN classification score for the predicted class after non-maximum suppression (softmax over
        classes). A ranking signal from the model, not a calibrated probability.
      calibrated: false
      range: [0, 1]
    settings:
      architecture: fasterrcnn_resnet50_fpn_v2
      taxonomy: coco
      device: auto            # cuda when available, otherwise cpu
      # Operational cutoff: detections scoring below this are counted on the run but not stored.
      # It is NOT a validated threshold and says nothing about correctness. Change it here, not in code.
      min_score: 0.5
      max_detections: 100
      # Images are reduced to this longest side before inference; boxes are scaled back to the original.
      max_input_side: 1333

  # ONLINE model. The photograph is sent to Roboflow's hosted YOLO API, so it is unavailable until the owner sets
  # GEOPOC_ONLINE_ENABLED=true, GEOPOC_ROBOFLOW_API_KEY and GEOPOC_ROBOFLOW_MODEL_ID (project/version) in .env.
  # It needs no weights and no PyTorch. See models/cards/roboflow_yolo_online.md.
  - name: roboflow_yolo_online
    version: hosted_v1
    pipeline: ground_image
    task: object_detection
    runtime: roboflow
    locality: remote
    card: models/cards/roboflow_yolo_online.md
    licence: "Online service: governed by Roboflow's terms and by the licence of whichever model is chosen. Photographs leave this machine."
    score:
      semantics: >-
        The hosted model's own confidence for the predicted class. A ranking signal from the model, not a calibrated
        probability.
      calibrated: false
      range: [0, 1]
    settings:
      taxonomy: roboflow
      # Detections under this are not requested from Roboflow. NOT a validated threshold.
      min_score: 0.4
      max_detections: 100
      # The image is reduced to this longest side before it is uploaded; boxes are scaled back to the original.
      max_input_side: 1280

  # ONLINE, OPEN-VOCABULARY model. YOLO-World finds whatever class names it is given in words (no training), so it suits
  # ground, drone and satellite photographs alike. Same opt-in as above (online mode + API key; it needs no model id).
  # Edit `classes` here, or set GEOPOC_ROBOFLOW_WORLD_CLASSES in .env. Keep the list short: more names, less reliable.
  - name: roboflow_yolo_world_online
    version: hosted_v1
    pipeline: ground_image
    task: object_detection
    runtime: roboflow_world
    locality: remote
    card: models/cards/roboflow_yolo_world_online.md
    licence: "Online service: governed by Roboflow's terms and the YOLO-World model's licence. Photographs leave this machine."
    score:
      semantics: >-
        YOLO-World's own confidence that the box matches the class name it was given. A ranking signal from the model,
        not a calibrated probability. It is relative to the names in the list, so adding or removing names changes it.
      calibrated: false
      range: [0, 1]
    settings:
      taxonomy: yolo_world
      yolo_world_version: v2-l
      min_score: 0.3
      max_detections: 150
      max_input_side: 1280
      classes:
        - person
        - car
        - truck
        - bus
        - van
        - motorcycle
        - bicycle
        - train
        - boat
        - ship
        - airplane
        - helicopter
        - building
        - house
        - bridge
        - road
        - tower
        - antenna
        - storage tank
        - shipping container
        - tent
        - tree
        - solar panel
        - animal
